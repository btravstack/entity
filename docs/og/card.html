<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>entity — social card</title>
    <!--
      Source for docs/public/og-entity.png — the BtravStack social-card
      template, 1280x640. Regenerate with:

          pnpm --filter ./docs og:card

      Colours are the literal values of @btravstack/theme's tokens
      (dist/tokens.css); the token name is in a comment beside each.

      Rendered through headless Chrome rather than rsvg-convert: Geist is a
      webfont, not a system font, and rsvg-convert resolves font-family
      through fontconfig against installed fonts only — it would fall back to
      Helvetica silently and produce a card that looks fine but does not match
      the rest of the stack.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=block"
    />
    <style>
      :root {
        --bg: oklch(13% 0.006 310); /* theme --bg */
        --text: oklch(95% 0.004 310); /* theme --text */
        --muted: oklch(72% 0.006 310); /* theme --muted */
        --faint: oklch(58% 0.006 310); /* theme --faint */
        --accent: #ee9cc4; /* entity's --accent, from theme/custom.css */
        --org-pink: #e0589a; /* theme --bt-pink — the ORG accent, constant across the stack */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
      }

      body {
        position: relative;
        overflow: hidden;
        background: var(--bg);
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The mark's halo — the same treatment carrying unthrown's green and
         amqp-contract's orange, in entity's accent. */
      .glow {
        position: absolute;
        left: 950px;
        top: 320px;
        width: 760px;
        height: 760px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle closest-side,
          color-mix(in srgb, var(--accent) 13%, transparent),
          transparent 72%
        );
      }

      .wordmark {
        position: absolute;
        left: 96px;
        top: 190px;
        font-size: 104px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--accent);
      }

      .tagline {
        position: absolute;
        left: 96px;
        top: 328px;
        max-width: 560px;
        font-size: 36px;
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: -0.012em;
        color: var(--text);
      }

      .url {
        position: absolute;
        left: 96px;
        top: 412px;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        font-weight: 400;
        color: var(--muted);
      }

      .footer {
        position: absolute;
        left: 96px;
        top: 570px;
        font-size: 19px;
        font-weight: 500;
        color: var(--faint);
      }
      .footer b {
        font-weight: 700;
      }
      .footer .btrav {
        color: var(--org-pink);
      }
      .footer .stack {
        color: var(--text);
      }

      /* The mark itself — referenced, never copied, so the card tracks the
         logo. logo-dark.svg is the variant for a DARK canvas (light #E3D7DE
         panel); logo-light.svg's #33262C panel would vanish on this one. */
      .mark {
        position: absolute;
        left: 950px;
        top: 320px;
        width: 500px;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <img class="mark" src="../public/logo-dark.svg" alt="" />
    <div class="wordmark">entity</div>
    <div class="tagline">Domain entities, declared once.</div>
    <div class="url">btravstack.github.io/entity</div>
    <div class="footer">
      Part of <b><span class="btrav">Btrav</span><span class="stack">Stack</span></b>
    </div>
  </body>
</html>
