autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - examples/*
  - docs

catalog:
  "@btravstack/commitlint": 0.1.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 2.0.0
  "@btravstack/tsconfig": 0.4.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 3.0.3
  "@commitlint/cli": 21.2.3
  # Real Postgres compiled to WASM and run in-process, so the relational example
  # (`examples/billing-relational`) exercises genuine transactions, row counts
  # and constraint violations inside the ordinary `pnpm test`, with no Docker
  # and no server. Held on 0.4: `kysely-pglite-dialect` below declares
  # `^0.2 || ^0.3 || ^0.4` as its peer range, and `strictPeerDependencies` is on.
  "@electric-sql/pglite": 0.4.6
  # Pinned to the exact prerelease the package's design doc measured
  # `ZodToJsonSchemaConverter`'s behaviour against (dual-direction JSON Schema
  # generation, the `[jsonSchema, optional]` return shape with no "unsupported"
  # flag). `@orpc/zod`'s stable "latest" line (1.x) predates the v2 API this
  # package's contract tests exercise.
  "@orpc/zod": 2.0.0-beta.41
  # Same release train as `@orpc/zod` above — the billing-api example defines a
  # contract and converts it to JSON Schema in the same file, so they move together.
  "@orpc/contract": 2.0.0-beta.41
  # `ZodToJsonSchemaConverter.convert` returns `[JsonSchema, optional]`, and
  # naming `JsonSchema` is what keeps an exported schema portable (TS2883).
  "@orpc/json-schema": 2.0.0-beta.41
  "@types/node": 26.6.4
  # Only for the comparison spec in `examples/billing-domain`, which runs the
  # same small model through Effect's `Schema.Class` so the docs' comparison
  # page states measured behaviour, not recalled behaviour. Held on the 3.x
  # line: issue #140 compares against the v3 `Schema.Class` API, and 4.0
  # (2026-10-01) rewrote Schema.
  effect: 3.22.2
  "@unthrown/oxlint": 5.11.0
  "@unthrown/standard-schema": 5.11.0
  "@unthrown/vitest": 5.11.0
  knip: 6.39.0
  # The relational example's query builder. A query builder rather than an ORM:
  # it maps plain rows and tracks nothing, which is the shape an immutable
  # entity wants at the adapter (`toJSON()` out, `make()` back).
  kysely: 0.29.6
  # Connects Kysely to PGlite for the relational example's tests. Its pglite
  # peer range is what holds `@electric-sql/pglite` on 0.4.
  kysely-pglite-dialect: 1.3.1
  lefthook: 2.1.17
  oxfmt: 0.71.0
  oxlint: 1.86.0
  tsdown: 0.23.0
  turbo: 2.11.7
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.13.1
  # 7.0.2 is the exact release the package's design doc measured the
  # construction-seal declaration-emit behaviour against (zero TS4020, `declare
  # const CtorKey: unique symbol` carried module-local into the emitted
  # `types.d.ts`). Kept in step with that measurement rather than trailing it.
  typescript: 7.0.2
  # The TypeScript consumers actually build with, for the second declaration-emit
  # pass in `examples/billing-domain` (`tsconfig.emit.json`, run twice).
  # Both versions enforce the ceiling on serialised type length; 5.9.3's is
  # simply lower. Measured on one entity carrying a 30-member enum, a branded
  # timestamp and a six-member literal union: 5.9.3 rejected it with `TS7056`
  # while 7.0.2 accepted the same shape — widen the entity and both reject it.
  # That band of realistic domain widths is where issues #31 and #32 shipped.
  # Aliased because one `package.json` cannot name `typescript` twice.
  typescript-consumer: "npm:typescript@5.9.3"
  unthrown: 5.11.0
  "@vitest/coverage-v8": 5.0.3
  vitepress: 1.6.4
  vitest: 5.0.3
  zod: 4.6.5

catalogs:
  # TypeDoc's own toolchain, deliberately NOT the default catalog's TypeScript.
  # `typescript: 7.0.2` above is the native port: it ships `lib/tsc.js` (a thin
  # launcher) and no `typescript.js`, so the compiler API TypeDoc is written
  # against does not exist there — measured, and the reason `typedoc` runs from
  # the `docs` workspace rather than from `packages/entity` as it does in the
  # other btravstack repos. 6.0.3 is the last release carrying the JS API, and
  # is what `typedoc@0.28`'s peer range allows.
  typedoc:
    typescript: 6.0.3

# Force patched versions of vulnerable transitive dependencies. Every advisory
# below reaches us only through dev/build tooling (never the published package's
# runtime deps, which are the three peers). Each selector is version-scoped so
# only the affected line moves and unrelated lines are untouched.
overrides:
  # GHSA-pqg4-j6r4-53mv (Critical): shell-quote command injection through a
  # line terminator after a comment token. Reaches us via the Changesets CLI's
  # editor launcher, never the published entity package.
  "shell-quote@>=1.8.4 <1.11.0": "1.11.0"
  # GHSA-fx2h-pf6j-xcff (High, `server.fs.deny` bypass on Windows alternate data
  # streams) plus three moderates on the same line: GHSA path traversal in
  # optimized deps, launch-editor NTLMv2 disclosure, and the esbuild dev-server
  # advisory reached through vite's own dependency. All four are dev-server-only;
  # the docs ship as static HTML. They reach us via docs > vitepress > vite:
  # vitepress 1.6.x pins `vite ^5.4.14`, and the 5.x line has no patched release,
  # so lift any pre-6.4.3 vite to 6.4.3 (the first fixed version). That also
  # drags esbuild up to a patched 0.25.x. `vitepress build` and `vitepress dev`
  # are both verified against it.
  #
  # Side effect, measured and accepted: vitest's own vite was resolving to 8.2.0,
  # and pnpm dedupes it onto this 6.4.3 rather than keeping a second copy —
  # vitest 5.0.3 declares `vite: "^6.4.0 || ^7.0.0 || ^8.0.0"`, so 6.4.3 is
  # inside its supported range and the suite passes on it. Path-scoped selectors
  # (`vitepress>vite`) were tried and produce the byte-identical tree, because
  # the dedupe is resolution, not the selector — so the simpler form is kept.
  # Pinning vitest's vite apart would mean an inline `vite` devDependency on the
  # library package for a purely transitive concern; not worth it.
  "vite@<6.4.3": "6.4.3"
  # GHSA-2883-xcg3-v3hh (High): js-yaml expands merge keys without bounding CPU
  # on empty merge sources. It reaches us through commitlint's loader chain, not
  # runtime code. 4.3.2 is the first patched release.
  "js-yaml@<4.3.2": "4.3.2"
  # GHSA-2v37-7h3g-55p8 (High): nanoid custom generators can loop indefinitely
  # when size is zero. Reaches us only through the docs build —
  # docs > @btravstack/theme > vitepress > postcss > nanoid — never the shipped
  # package. 3.3.18 is the first release patched for the widened range.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p (High) and a moderate quadratic
  # `{a},b}` rewrite: brace-expansion DoS. Reaches us only through the docs
  # build — docs > typedoc > minimatch > brace-expansion. 5.0.12 fixes all three.
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  # Two Highs (authority injection via port, host confusion via unclosed
  # bracket) and a moderate (host case normalization) in fast-uri 3.1.6.
  # Reaches us through commitlint's config validator (ajv), never runtime code.
  # 3.1.8 is the first release clear of all three.
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  # GHSA (High): source-map-js event-loop DoS via indexed section offsets.
  # Reaches us through vite > postcss, in the docs and test toolchains only.
  "source-map-js@<1.2.2": "1.2.2"
  # GHSA (High): @vue/server-renderer XSS via missing CR in the attribute-name
  # blacklist. Reaches us through vitepress's SSG of our own static docs. Lift
  # `vue` rather than the renderer alone: vue pins its @vue/* siblings exactly,
  # so moving one would split the set.
  "vue@<3.5.42": "3.5.42"
  # Moderate: markdown-it linkify quadratic paths. Reaches us through typedoc
  # rendering our own source comments in the docs build.
  "markdown-it@<14.3.1": "14.3.1"
  # Moderate: smol-toml quadratic parse(). Reaches us through knip only.
  "smol-toml@<1.9.0": "1.9.0"

peerDependencyRules:
  ignoreMissing:
    # Optional analytics peer of VitePress's bundled Algolia DocSearch.
    - search-insights

minimumReleaseAgeExclude:
  - knip@6.32.0
  # First-party shared config (@btravstack scope): adopt immediately, skip any
  # registry-maturity delay — these are published from btravstack repos.
  - "@btravstack/theme"
  - "@btravstack/typedoc"
  - lefthook-windows-x64@2.1.17

allowBuilds:
  esbuild: true
  lefthook: true
