name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: btravstack/config/.github/workflows/ci-reusable.yml@workflows-v1
    with:
      # "" uses .node-version (the dev/primary version). 22.19 is the root
      # package's engines floor, i.e. the oldest Node this repo is developed on.
      # 20 is the published package's engines floor — it is here so that floor
      # is proven rather than merely declared. See the note in CONTRIBUTING
      # before widening or narrowing any of the three.
      node-versions: '["", "22.19", "20"]'
