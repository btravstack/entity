name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: btravstack/config/.github/workflows/ci-reusable.yml@workflows-v1
    with:
      # "" uses .node-version (the dev/primary version, currently 24.16.0).
      # 20 is the published package's engines floor and 22.19 the root
      # package's — both are here so those floors are proven rather than
      # merely declared. 24 and 26 cover the current LTS and the live release
      # line, so a consumer on either is exercised rather than assumed. Note
      # 24 overlaps "" while .node-version stays on 24.x; it is listed
      # explicitly so bumping .node-version does not silently drop 24
      # coverage. See the note in CONTRIBUTING before changing any of these.
      node-versions: '["", "20", "22.19", "24", "26"]'
